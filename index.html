<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EIB Assistant – RSU Tax Formatter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p  { color: #94b4e4; margin-bottom: 28px; font-size: 1.05rem; }
    a.btn {
      display: inline-block;
      background: #1967d2;
      color: white;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    a.btn:hover { background: #1558b8; }
    .note { margin-top: 20px; color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size:3rem;margin-bottom:16px">🧾</div>
    <h1>EIB Assistant</h1>
    <p>RSU Tax Formatter — Payroll Off-cycle Payment</p>
    <a class="btn" href="http://localhost:8501" target="_blank">Open App</a>
    <p class="note">Run <code>streamlit run app.py</code> to start the server.</p>
  </div>
</body>
</html>
